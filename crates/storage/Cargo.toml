[package]
name = "zemdb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
zemdb-core = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
crc32fast = { workspace = true }
imbl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
zstd = { workspace = true }
fs2 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.38", default-features = false, features = ["sync"] }
ruzstd = { workspace = true }
# The file layer over the Origin Private File System of the browser (`files::opfs`). The version
# of wasm-bindgen is the one of the CLI of the browser harness (tools/browser/build.sh).
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "DomException",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

[dev-dependencies]
tempfile = { workspace = true }
# The unit tests check the WebAssembly Zstandard codec natively, against `zstd`.
ruzstd = { workspace = true }

# The unit tests in wasm32 (`cargo test --target wasm32-unknown-unknown --lib`), which run in a
# dedicated Worker of a browser with the `wasm-bindgen-test-runner` of `.cargo/config.toml`: the
# version of the lock of the browser harness.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
