[package]
name = "zemdb-browser-server"
description = "The test server of the browser harness: the real router, the page and the harness routes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zemdb-core = { path = "../../../crates/core" }
zemdb-server = { path = "../../../crates/server" }
# The native snapshots of the suite `engine`, and the check of those of the browser.
zemdb-storage = { path = "../../../crates/storage" }
axum = "0.7"
bytes = "1.6"
http-body = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1.49", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
