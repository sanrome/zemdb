[package]
name = "zemdb-browser-steps"
description = "The steps of the browser harness, compiled to wasm32, and its unit tests in a browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` for `wasm-bindgen`, `rlib` for the unit tests.
crate-type = ["cdylib", "rlib"]

# Only in wasm32: elsewhere the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
zemdb-core = { path = "../../../crates/core" }
# The same version as in the Cargo.lock of the root, and as the CLI that the CI installs.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope",
    "DomException",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "Headers",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "Response",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
