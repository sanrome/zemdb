name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p zemdb-core -p zemdb-storage -p zemdb-client --target wasm32-unknown-unknown
      - run: cargo clippy -p zemdb-core -p zemdb-storage -p zemdb-client --target wasm32-unknown-unknown -- -D warnings
      # The unit tests of the storage in wasm32, which the browser job runs (its integration
      # tests are native only).
      - run: cargo clippy -p zemdb-storage --target wasm32-unknown-unknown --lib --profile test -- -D warnings

  browser:
    name: Browser (Chromium and Firefox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/browser
      # The CLI of the version of wasm-bindgen in the lock of the harness (build.sh checks that
      # it is the one of the root's lock too), with its wasm-bindgen-test-runner.
      - run: >-
          cargo install wasm-bindgen-cli --locked --version
          "$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
      # The harness only: with --all it would also check the crates of the root, as the job fmt.
      - run: cargo fmt -- --check
      - run: cargo clippy -p zemdb-browser-steps --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy -p zemdb-browser-server --all-targets -- -D warnings
      - run: cargo test -p zemdb-browser-server
      - run: sh build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-${{ hashFiles('tools/browser/package-lock.json') }}
      # The Chromium and the Firefox of Playwright, builds of its own.
      - run: npx playwright install --with-deps chromium firefox
      - run: node run.mjs
      - run: node run.mjs --self-check
      - run: node run.mjs --browser firefox
      - run: node run.mjs --browser firefox --self-check
      # The unit tests in wasm32, in a dedicated Worker of the Chrome of the runner: those of the
      # harness, and from the root those of the storage (its layer over the OPFS), with the
      # wasm-bindgen-test-runner installed above, which .cargo/config.toml names.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p zemdb-browser-steps --target wasm32-unknown-unknown
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --target wasm32-unknown-unknown -p zemdb-storage --lib
        working-directory: .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (Rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        # The declared rust-version builds the crates; the tests' dev-dependencies need 1.88.
        include:
          - toolchain: 1.85.0
            command: cargo build --workspace --lib --bins
          - toolchain: 1.88.0
            command: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}
