# Spike S1 (Fase 4.5), question 1: the OPFS from Rust, in a dedicated Worker.
# Not part of the zemdb workspace; never merged.
[package]
name = "s1-opfs"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WorkerGlobalScope",
    "Performance",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemHandle",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
    "FileSystemRemoveOptions",
] }

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace]
